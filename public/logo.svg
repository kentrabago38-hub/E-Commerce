<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="vinea_logo_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1118" />
      <stop offset="50%" stop-color="#1A080C" />
      <stop offset="100%" stop-color="#0F0406" />
    </linearGradient>
    
    <linearGradient id="vinea_logo_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="25%" stop-color="#E5C778" />
      <stop offset="70%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#936F26" />
    </linearGradient>

    <linearGradient id="vinea_logo_glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9B2338" />
      <stop offset="100%" stop-color="#5B1421" />
    </linearGradient>

    <filter id="vinea_logo_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Deep Bordeaux Badge Background with Rounded Squircle -->
  <rect width="64" height="64" rx="15" fill="url(#vinea_logo_bg)" />
  
  <!-- Outer Gold Luxury Border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="13" fill="none" stroke="url(#vinea_logo_gold)" stroke-width="1.8" />
  
  <!-- Subtle Filigree Inner Ring -->
  <circle cx="32" cy="32" r="24.5" fill="none" stroke="url(#vinea_logo_gold)" stroke-width="0.75" stroke-opacity="0.35" stroke-dasharray="2 1.5" />

  <!-- Wine Chalice Liquid Glow in Background -->
  <path d="M 23 21 C 23 31, 41 31, 41 21 Z" fill="url(#vinea_logo_glow)" opacity="0.6" />

  <!-- Ornate Golden Wine Chalice & Intertwined Crest -->
  <g filter="url(#vinea_logo_shadow)">
    <!-- Wine Glass Bowl Silhouette -->
    <path d="M 21 17 C 21 31, 30.5 35.5, 30.5 39 L 30.5 45.5 L 25 46.5 L 25 48.5 L 39 48.5 L 39 46.5 L 33.5 45.5 L 33.5 39 C 33.5 35.5, 43 31, 43 17 C 43 16.5, 42 16.5, 40.5 16.5 C 38.5 16.5, 25.5 16.5, 23.5 16.5 C 22 16.5, 21 16.5, 21 17 Z" 
          fill="none" 
          stroke="url(#vinea_logo_gold)" 
          stroke-width="1.6" 
          stroke-linejoin="round" />

    <!-- Center Serif Roman 'V' Monogram -->
    <path d="M 23.5 19.5 L 28 19.5 L 32 31.5 L 36 19.5 L 40.5 19.5 L 40.5 20.8 L 38.5 21 L 33.2 36.5 L 30.8 36.5 L 25.5 21 L 23.5 20.8 Z" 
          fill="url(#vinea_logo_gold)" />

    <!-- Grape Cluster Crest / Crown at Top -->
    <path d="M 32 14.5 C 30 11.5, 26 12, 26 13.5 C 26 15, 29 15, 32 14.5 Z" fill="url(#vinea_logo_gold)" opacity="0.9" />
    <path d="M 32 14.5 C 34 11.5, 38 12, 38 13.5 C 38 15, 35 15, 32 14.5 Z" fill="url(#vinea_logo_gold)" opacity="0.9" />
    <path d="M 32 14.5 C 32 11, 33 9.5, 34.5 9" fill="none" stroke="url(#vinea_logo_gold)" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="29" cy="14" r="1.5" fill="url(#vinea_logo_gold)" />
    <circle cx="35" cy="14" r="1.5" fill="url(#vinea_logo_gold)" />
    <circle cx="32" cy="16" fill="url(#vinea_logo_gold)" r="1.6" />
  </g>
</svg>
